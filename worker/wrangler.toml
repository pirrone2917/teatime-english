name = "teatime-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false
# garde les variables ajoutées dans le tableau de bord Cloudflare lors des mises à jour
keep_vars = true

[triggers]
crons = ["10 0 * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "teatime"
database_id = "de849373-36dd-4661-8631-3e4b868fe45a"
