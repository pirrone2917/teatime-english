<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Time English</title>
<meta name="theme-color" content="#F6EFE2">
<meta name="description" content="Exercices d'anglais du cours de Miss Kokkinis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tea Time">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gochi+Hand&display=swap">
<style>
:root{
  --bg:#F6EFE2;--card:#FFFDF8;--navy:#1C2E5E;--line1:#1F57B5;--line2:#D02B27;--ink:#1F2430;--mute:#6B6F7A;--line:#E2D8C6;--rule:#EDE3D2;--soft:#EFE7D8;--grey:#CFC6B5;
  --blue:#1F4FB5;--red:#D7263D;--amber:#B86E00;--green:#2E7D32;--green-bg:#EAF5EA;--bad-bg:#FDECEE;--hl:#FFF27A;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.5 Andika,"Comic Neue","Trebuchet MS",system-ui,sans-serif}
button,input,textarea{font-family:inherit;color:inherit}
small{display:block;color:var(--mute);font-size:14px;line-height:1.4}
b{font-weight:700}
.hand{font-family:"Gochi Hand","Segoe Print","Bradley Hand",cursive;font-weight:400}
#app{max-width:540px;margin:0 auto;padding:0 18px 104px}
.scal{height:30px;margin:0 -18px 4px;background:radial-gradient(circle at 50% 0,var(--grey) 0 20px,transparent 21px) center top/52px 30px repeat-x}
.h2{font-size:18px;font-weight:700;margin:24px 0 6px}
.mut{color:var(--mute);font-size:15px;margin:4px 0 10px}
.lbl{margin:14px 0 6px;font-weight:700;font-size:15px}
.warn{background:var(--bad-bg);border-left:3px solid var(--red);padding:10px 12px;font-size:15px;margin:12px 0}

/* en-tête */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 0 10px;border-bottom:1.5px solid var(--line)}
.top .nm{font-size:20px;font-weight:700;display:block;line-height:1.2}
.lnk{background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}

/* boutons & cartes */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;width:100%;text-align:left;display:block}
button.card{cursor:pointer}
.btn{font-weight:700;font-size:17px;border:2px solid var(--ink);border-radius:10px;padding:12px 16px;cursor:pointer;background:#fff;color:var(--ink);margin:6px 0}
.btn:active{transform:translateY(1px)}
.btn.red{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:#fff}
.btn.dng{color:var(--red);border-color:var(--red)}
.btn.full{display:block;width:100%}
.btn.big{padding:16px;font-size:19px}
.btn[disabled]{opacity:.35;pointer-events:none}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}

/* note de la prof */
.say{display:flex;gap:12px;align-items:center;margin:14px 0 16px}
.say .tch{flex:none;line-height:0}
.bub{flex:1;border-left:2px solid var(--red);padding:2px 0 2px 12px}
.bub .hand{font-size:25px;line-height:1.15;color:var(--red);display:block}
.bub small{margin-top:4px;color:var(--ink);font-size:15px}

/* accueil */
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:4px 0 12px}
.seg button{flex:1;border:0;border-right:2px solid var(--ink);background:#fff;padding:9px 4px;font-weight:700;font-size:14px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--hl)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.game{border-top:5px solid var(--c,var(--blue))}
.game b{display:block;font-size:17px;line-height:1.25}
.game.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px dashed var(--ink);border-top:2px dashed var(--ink)}
.game.wide .hand{font-size:40px;color:var(--red);line-height:1;transform:rotate(-6deg)}

.lastc{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px dashed var(--grey);border-radius:10px;padding:10px 14px;margin:4px 0 0;font-size:15px;cursor:pointer}
.lastc.done{cursor:default}
.lastc small{margin-top:2px}
.lastc.done small{color:var(--green);font-weight:700}
/* barres */
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lc,var(--blue));transition:width .4s}
.prow2{margin:8px 0}
.prow2 .r{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:4px}
.srow{display:flex;gap:12px;align-items:center;padding:12px 14px 12px 0;border-left:6px solid var(--lc)}
.srow .tx{flex:1;padding-left:12px}
.srow .tx b{display:block;line-height:1.25}
.lv{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--mute)}

/* jeu */
.ph{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.x{border:2px solid var(--ink);background:#fff;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;flex:none}
.tube{flex:1;display:flex;gap:3px}
.tube i{flex:1;height:12px;border:1.5px solid var(--line);border-radius:2px}
.tube i.d{background:var(--blue);border-color:var(--blue)}
.tube i.ko{background:var(--red);border-color:var(--red)}
.tube i.c{background:var(--hl);border:2px solid var(--ink)}
.combo{font-weight:700;font-size:14px;min-width:42px;text-align:right;color:var(--red)}
.tm{height:4px;background:var(--soft);margin:-4px 0 4px}
.tm i{display:block;height:100%;background:var(--red);transition:width 1s linear}
#tm{text-align:right}
.tag{font-size:14px;color:var(--mute);margin:4px 0 4px;font-weight:700}
.q{font-size:23px;line-height:1.35;font-weight:700;margin:6px 0 16px}
.blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--ink);margin:0 4px;height:1em;vertical-align:-2px}
.ctx{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:15px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin:9px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.opt.sel{background:var(--hl);border-color:var(--ink)}
.opt.good{border-color:var(--green);background:var(--green-bg)}
.opt.good::after{content:" ✓";color:var(--green);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);text-decoration:line-through;text-decoration-color:var(--red)}
.opt[disabled]{cursor:default}
.inp{width:100%;padding:6px 2px;border:0;border-bottom:2.5px solid var(--ink);border-radius:0;background:transparent;font:400 28px/1.3 "Gochi Hand","Segoe Print",cursive;color:var(--blue)}
.inp:focus{outline:none;border-bottom-color:var(--blue);background:linear-gradient(transparent 70%,#FFF8B0 70%)}
.inp.small{font:400 18px Andika,system-ui,sans-serif;color:var(--ink)}
.inp.code{font:400 12px/1.3 ui-monospace,Menlo,monospace;border:1.5px solid var(--line);border-radius:8px;padding:8px;min-height:80px;margin:8px 0;resize:vertical;color:var(--ink)}
.spk{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.spk .btn{margin:0;padding:9px 14px;font-size:15px}
.line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;margin:10px 0;background:repeating-linear-gradient(transparent 0 49px,var(--rule) 49px 51px);border-bottom:2px solid var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tile{padding:7px 12px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;font-size:18px;cursor:pointer}
.tile.in{background:var(--hl)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{display:block;width:100%;padding:12px 8px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px;cursor:pointer;min-height:52px}
.mt.sel{background:var(--hl);border-color:var(--ink)}
.mt.done{border-color:var(--green);background:var(--green-bg);color:var(--green);pointer-events:none}
.mt.bad{border-color:var(--red);background:var(--bad-bg)}
.foot{margin-top:20px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* correction */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--green);box-shadow:0 -6px 24px rgba(35,38,45,.12);padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet.bad{border-top-color:var(--red)}
.sh-in{max-width:540px;margin:0 auto;max-height:76vh;overflow:auto}
.sh-t{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sh-t h3{margin:0;font:400 32px/1 "Gochi Hand","Segoe Print",cursive;color:var(--green)}
.sheet.bad .sh-t h3{color:var(--red)}
.ans{margin:6px 0 2px;font-size:18px}
.mine{margin:0 0 6px;color:var(--mute);font-size:15px}
.mine s{text-decoration-color:var(--red);text-decoration-thickness:2px}
.diag{background:#FFF6D6;border-left:4px solid #E08A00;border-radius:6px;padding:10px 12px;margin:8px 0;font-size:16px}
.diag>b,.why>b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--mute)}
.dif{font-size:19px;letter-spacing:.02em}
mark{background:#FFD95A;color:inherit;border-bottom:2px solid var(--red);padding:0 1px}
.why{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:16px;margin:8px 0}
.vt{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 10px}
.vt td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.vt td:first-child{font-weight:700;width:52%}
.vt small{display:inline;font-weight:400;font-size:12px}
.us{font-size:15px;margin:6px 0 8px;padding-left:10px;border-left:3px solid var(--blue)}
details.d{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:16px;background:#fff}
details.d summary{cursor:pointer;font-weight:700}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.ov{position:fixed;inset:0;background:rgba(35,38,45,.45);z-index:40;display:grid;place-items:center;padding:20px}
.ov .card{max-width:380px;margin:0}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;justify-content:space-around;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{background:none;border:0;font-weight:700;font-size:15px;padding:12px 10px;cursor:pointer;color:var(--mute)}
.nav .on{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:6px}

/* résultat */
.gradebox{text-align:center;margin:12px 0}
.grade{display:inline-block;font:400 64px/1 "Gochi Hand","Segoe Print",cursive;color:var(--red);border:3px solid var(--red);border-radius:50%;padding:18px 26px 12px;transform:rotate(-5deg)}
.pass{text-align:center;font:400 26px "Gochi Hand","Segoe Print",cursive;margin:8px 0}
.pass.y{color:var(--green)}
.pass.n{color:var(--red)}

/* profils */
.brand{font:400 44px/1 "Gochi Hand","Segoe Print",cursive;margin:10px 0 2px}
.prow{display:flex;gap:12px;align-items:center}
.prow b{font-size:19px}
.sw{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:700}
.sw input{width:22px;height:22px;accent-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:60;max-width:90%}

/* v7 : accueil, chemin, leçons, fin de séance */
:root{--amber:#B86E00}
.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 8px;border-bottom:1.5px solid var(--line)}
.top2 .nm{font-size:20px;font-weight:700;line-height:1.15}
.top2 .lnk{font-size:13px;padding:2px 0}
.chips{display:flex;gap:6px;flex:none}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:3px 10px 3px 8px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;background:#fff;white-space:nowrap}
.chip svg{width:24px;height:24px}
.today{display:block;width:100%;text-align:left;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;margin:2px 0 4px;font:inherit}
.today>b{font-size:21px;display:block;line-height:1.2}
.today .sub{opacity:.88;font-size:14px}
.today ul{margin:8px 0 12px;padding:0;list-style:none;font-size:15px}
.today li{display:flex;gap:8px;align-items:center;margin:4px 0;line-height:1.3}
.today li i{width:8px;height:8px;border-radius:50%;background:var(--hl);flex:none}
.today .go{background:#fff;color:var(--blue);font-weight:700;border-radius:10px;padding:11px;text-align:center;font-size:17px}
.today.done{background:var(--green)}.today.done .go{color:var(--green)}
.today:active{transform:translateY(1px)}
.fw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.fw>div{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.35}
.fw .t{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.path{padding:4px 0 2px}
.node{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.node .c{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:19px;background:#fff;flex:none;transition:transform .15s}
.node:active .c{transform:scale(.94)}
.node .tx b{display:block;font-size:16px;line-height:1.2}
.node .st{font:400 18px/1.15 "Gochi Hand","Segoe Print",cursive}
.node.ok .c{background:var(--green);border-color:var(--green);color:#fff}.node.ok .st{color:var(--green)}
.node.frag .c{border-color:var(--amber);border-style:dashed;color:var(--amber)}.node.frag .st{color:var(--amber)}
.node.cur .c{border-color:var(--blue);color:var(--blue)}.node.cur .st{color:var(--blue)}
.node.new .c{border-color:var(--grey);color:var(--mute)}.node.new .st{color:var(--mute)}
.node.focus .c{background:var(--hl);border-color:var(--ink);color:var(--ink);width:64px;height:64px;box-shadow:0 0 0 6px #FFF8C2;animation:pulse 2.4s ease-in-out infinite}
.node.focus .st{color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 10px #FFF8C2}}
.link{height:16px;border-left:2.5px dashed var(--grey);margin:3px 0}
.bd{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;display:inline-block}
.bd.ok{background:var(--green-bg);color:var(--green)}.bd.frag{background:#FFF1DC;color:#8A5200}.bd.cur{background:#E8EEFA;color:var(--blue)}.bd.new{background:var(--soft);color:var(--mute)}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.lrow b{display:block;line-height:1.25}
.stp{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.stp .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.stp b{display:block}.stp small{color:var(--mute);font-size:13.5px}
.stp.done{background:var(--green-bg);border-color:#BFDDBF}.stp.done .n{background:var(--green);border-color:var(--green);color:#fff}
.stp.now{border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--hl)}
.stp.later{opacity:.6}
.fm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.fm span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:#fff}
.mini{height:6px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}.mini i{display:block;height:100%;background:var(--blue)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px;text-align:center}
.counts div{border:1.5px solid var(--line);border-radius:10px;padding:6px 2px}.counts b{display:block;font-size:20px}
.wl{border:1.5px solid var(--line);border-radius:12px;padding:2px 12px;margin-bottom:8px;background:#fff}
.wl summary{cursor:pointer;font-weight:700;padding:9px 0;display:flex;justify-content:space-between;gap:8px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.wrow small{display:inline;color:var(--mute)}
.mv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mv:last-child{border:0}.mv .ar{color:var(--mute);margin:0 4px}
.week{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.week span{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.week span.y{background:var(--hl);border-color:var(--ink);color:var(--ink)}
.week span.t{outline:2px dashed var(--red);outline-offset:2px}
.hurra{text-align:center;margin:10px 0 0}
.hurra .hand{display:block;font-size:46px;line-height:1;color:var(--red);animation:pop .5s ease-out both}
.hurra .tch{display:inline-block;animation:pop .45s ease-out both}
.gradebox .grade{animation:pop2 .55s .15s ease-out both}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes pop2{0%{transform:scale(.5) rotate(-5deg);opacity:0}70%{transform:scale(1.08) rotate(-5deg)}100%{transform:scale(1) rotate(-5deg);opacity:1}}
.node.lock{opacity:.72}.node.lock .c{border-color:var(--line);background:var(--soft);color:var(--mute);font-size:17px}.node.lock .st{color:var(--mute)}
.plv{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
.choice .card{margin:0 0 10px;cursor:pointer}.choice .card b{display:block;font-size:17px}
.choice .card.on{border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--hl)}
.lrow.lock{opacity:.6}

/* ================= v9 : Tea Time Underground ================= */
.say{display:flex;gap:10px;align-items:center;margin:12px 0 12px}
.say .tch{flex:none;line-height:0;border-radius:50%;box-shadow:0 0 0 3px var(--card)}
.bub{flex:1;background:var(--card);border:0;border-radius:14px;padding:8px 12px;position:relative;box-shadow:0 1px 0 var(--line)}
.bub:before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--card);border-left:0}
.bub .hand{font-size:22px;line-height:1.1;color:var(--red);display:block}
.bub small{margin-top:3px;color:var(--ink);font-size:14.5px}
.top2{border-bottom:0;padding:12px 0 8px}
.chip{background:var(--card);border-color:var(--line)}
.hero{position:relative;height:230px;border-radius:18px;overflow:hidden;background:#2A2E36;margin:2px 0 0}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero.anim .train{animation:arrive 2.4s cubic-bezier(.16,.84,.3,1) .2s both}
.hero.anim .doorL{animation:openL .6s ease-out 2.7s both}.hero.anim .doorR{animation:openR .6s ease-out 2.7s both}
.hero:not(.anim) .doorL{transform:translateX(-30px)}.hero:not(.anim) .doorR{transform:translateX(30px)}
@keyframes arrive{from{transform:translateX(-860px)}to{transform:none}}
@keyframes openL{to{transform:translateX(-30px)}}@keyframes openR{to{transform:translateX(30px)}}

<div id="app"></div>
<script>
(function(){
'use strict';

/* =====================================================================
   1. CONTENU — les "lignes" (thèmes) et les questions.
   Pour ajouter un cours : ajouter un thème dans SK (si nouveau) + des
   questions plus bas. Dans les QCM, la 1re option est toujours la bonne
   (elles sont mélangées à l'affichage).
   ===================================================================== */
const SK=[
 {id:'dlg',lvl:1,name:'Hello! Se présenter',ic:'👋',c:'#00A4A7',sheet:"<p>Hi! Are you a new student? — <b>Yes, I am.</b></p><p>Where are you from? — I'm from Italy.</p><p>Can you spell your name, please? · Sorry, can you repeat that? · Welcome to the class!</p><p>Réponse courte avec <i>to be</i> : jamais de contraction à la fin (❌ Yes, I'm).</p>"},
 {id:'tobe',lvl:1,name:'To be & my / your / his…',ic:'🙋',c:'#6950A1',sheet:"<p>I <b>am</b> · you <b>are</b> · he/she/it <b>is</b> · we <b>are</b> · they <b>are</b>.</p><p>my · your · <b>his</b> · <b>her</b> · its · our · their — ils s'accordent avec le <b>possesseur</b>.</p><p>a + consonne (a student) · an + voyelle (an engineer).</p>"},
 {id:'ctry',lvl:1,name:'Pays & nationalités',ic:'🌍',c:'#00782A',sheet:"<p>Belgium → Belgian · Poland → Polish · Spain → Spanish · Germany → German · Ireland → Irish · Wales → Welsh.</p><p>Pays <b>et</b> nationalités : toujours une majuscule.</p>"},
 {id:'num',lvl:1,name:'Nombres & objets',ic:'🔢',c:'#0098D4',sheet:"<p><b>13–19 = -teen</b> (accent à la fin : thir<b>TEEN</b>) · <b>20–90 = -ty</b> (accent au début : <b>NIN</b>ety).</p><p>⚠️ forty (40) s'écrit sans u. Les jours prennent une majuscule.</p><p>a pen · the door · a sofa · a window · a desk</p>"},
 {id:'age',lvl:1,name:'Âge & être d’accord',ic:'🎂',c:'#EE7C0E',sheet:"<p>Âge avec <b>to be</b> : I <b>am</b> 36 (years old).</p><p><b>I agree</b> with you : pas d'auxiliaire be.</p>"},
 {id:'wh',lvl:1,name:'Questions en Wh-',ic:'❓',c:'#E86A10',sheet:"<p>How old are you? · What's your name? · Where are you from? · What's your phone number? · What do you do? / What's your job? · Can you spell your name? · How are you?</p>"},
 {id:'spell',lvl:1,name:'Épeler & dictée',ic:'🔤',c:'#9B0056',sheet:"<p><b>double + lettre</b> = la lettre deux fois (R-O-double S-I = Rossi).</p><p>Mots à retenir : Wednesday · exercise · teacher · journey · airport · yogurt.</p>"},
 {id:'fam',lvl:1,name:'La famille',ic:'👨‍👩‍👧',c:'#E32017',sheet:"<p>mother · father · son · daughter · brother · sister · uncle · aunt · niece · nephew · grandfather · granddaughter · daughter-in-law.</p>"},
 {id:'this',lvl:1,name:'This / that / these / those',ic:'👉',c:'#F386A0',sheet:"<p><b>this / these</b> = proche (ici) · <b>that / those</b> = loin (là-bas).</p><p>Pluriels irréguliers : child → <b>children</b> · man → <b>men</b> · woman → <b>women</b>.</p>"},
 {id:'hg',lvl:1,name:'Have got',ic:'🎒',c:'#B36305',sheet:"<p>I/you/we/they <b>have got</b> · he/she/it <b>has got</b>.</p><p>Négatif : <b>haven't / hasn't got</b>. Question : <b>Have/Has</b> + sujet + got ?</p><p>Réponse courte : Yes, they <b>have</b>. (sans got)</p>"},
 {id:'pos',lvl:1,name:"Cas possessif 's",ic:'🔑',c:'#0019A8',sheet:"<p>Singulier : <b>'s</b> → my father's car · Charles's car.</p><p>Pluriel en -s : <b>'</b> seule → my parents' house.</p><p>Pluriel sans -s : <b>'s</b> → the children's toys.</p><p>Aussi pour les dates : tomorrow's meeting.</p><p>Avec un pronom : adjectif possessif (his car), jamais 's.</p>"},
 {id:'time',lvl:1,name:"L'heure",ic:'🕒',c:'#7156A5',sheet:"<p>8:00 <b>eight o'clock</b> · 9:30 <b>half past nine</b> · 11:15 <b>quarter past eleven</b> · 2:45 <b>quarter to three</b> · 6:10 <b>ten past six</b> · 12:55 <b>five to one</b>.</p><p>past = après l'heure · to = avant l'heure suivante. Version digitale : ten thirty.</p>"},
 {id:'ps',lvl:1,name:'Présent simple',ic:'🔁',c:'#00A4A7',sheet:"<p>I play / she <b>plays</b> · I don't play / she <b>doesn't</b> play · <b>Do</b> you play? / <b>Does</b> she play?</p><p>-s / -es à la 3e personne : watches · goes · studies.</p><p>Emplois : habitude · vérité générale · horaires officiels (The train leaves at 10).</p>"},
 {id:'there',lvl:2,name:'There is / There are',ic:'📍',c:'#E32017',sheet:"<p><b>There is / There's</b> = il y a (singulier ou indénombrable) : There is a cat in the garden.</p><p><b>There are</b> = il y a (pluriel) : There are three chairs around the table.</p><p>Négatif : there <b>isn't</b> / there <b>aren't</b>.</p><p>Énumération : le verbe suit le <b>premier nom</b> : There <b>is</b> a bathroom and two bedrooms / There <b>are</b> two bedrooms and a bathroom.</p>"},
 {id:'its',lvl:2,name:"It's · They're · There",ic:'🎯',c:'#0019A8',sheet:"<p><b>It's</b> (= it is) = c'est : pronom pour quelque chose de <b>déjà identifié</b> — What's that noise? It's the neighbour's dog.</p><p><b>They're</b> (= they are) = ils/elles sont — Who are those people? They're my colleagues.</p><p><b>There is/are</b> annonce, <b>it's/they're</b> reprend.</p><p>⚠️ <b>Their</b> (leur) · <b>there</b> (il y a) · <b>they're</b> (ils sont) : même prononciation !</p>"},
 {id:'like',lvl:2,name:'Goûts & préférences',ic:'❤️',c:'#F386A0',sheet:"<p>I <b>love</b> · I <b>really like</b> · I <b>like</b> · I <b>don't like</b> · I <b>really don't like</b> · I <b>hate</b> · I <b>prefer</b> (aussi : I enjoy…, I don't mind…).</p><p>Toujours suivi du verbe en <b>-ing</b> : I love cooking · I hate going to the park · I prefer watching TV.</p><p>Do you prefer swimming <b>or</b> running ?</p>"},
 {id:'ing',lvl:2,name:'Orthographe en -ing',ic:'✍️',c:'#00782A',sheet:"<p>1) cas général : +ing → cooking, playing.</p><p>2) verbe en -e : on enlève le e → making, writing.</p><p>3) verbe court : on double la consonne → swimming, running, sitting.</p><p>4) -ie → -ying → lying, dying.</p><p>⚠️ visit → visiting · camp → camping (pas de doublement).</p>"},
 {id:'voc',lvl:2,name:'Vocabulaire du cours',ic:'📒',c:'#E86A10',sheet:"<p><b>also</b> = aussi, également · <b>boring</b> = ennuyeux · <b>going</b> = aller · <b>flat</b> = appartement (UK) · <b>nearby</b> = tout près · <b>neighbour</b> = voisin · <b>often</b> = souvent.</p><p>there is/isn't = il y a (sg) · there are/aren't = il y a (pl).</p><p>⚠️ « beaucoup » = a lot of / much / many, <i>pas</i> also !</p>"},
 {id:'some',lvl:2,name:'Some / Any',ic:'',c:'#1F4FB5',sheet:"<p>= du, de la, de, des, quelques.</p><p><b>some</b> → phrases affirmatives : There are some things on my list. · Let's go get some ice cream.</p><p><b>any</b> → négatives et questions : They don't buy any apples. · Do you need any strawberries?</p><p>Cas particuliers :</p><p>• <b>some</b> dans une question quand on <b>offre</b> ou demande poliment : Would you like some coffee? · Can I have some water, please?</p><p>• <b>any</b> en affirmatif = « n'importe quel » : Choose any book.</p><p>• <b>any</b> après if, unless, whether : If you have any questions, ask me.</p>"},
 {id:'much',lvl:2,name:'Much / Many / A lot of',ic:'',c:'#D7263D',sheet:"<p><b>much / many / a lot of</b> = beaucoup · <b>how much / how many</b> = combien.</p><p><b>many</b> + dénombrable (apples, customers, friends) · <b>much</b> + indénombrable (money, toothpaste, water, time).</p><p><b>a lot of</b> marche avec les deux, surtout en phrase affirmative : Kate always buys a lot of bananas · They have a lot of broccoli.</p><p>Négatif : There aren't many customers today · We haven't got much toothpaste.</p><p>Question : How many tomatoes do you want? · How much time do you spend in the park?</p>"},
 {id:'ime',lvl:2,name:'I ou me ?',ic:'',c:'#2E7D32',sheet:"<p><b>I</b> = sujet : celui qui fait l'action. <b>me</b> = complément : celui qui reçoit l'action, ou qui vient après une préposition.</p><p>I love music ↔ Music relaxes me · I call her ↔ She calls me.</p><p><b>Le test magique</b> : quand il y a deux personnes, enlève l'autre. Tom and ___ go to school → ___ go to school → <b>I</b> go. She invites Tom and ___ → She invites ___ → <b>me</b>.</p><p><b>I</b> : sujet (I work in an office) · sujet composé (My sister and I live together) · réponse courte (Yes, I do).</p><p><b>me</b> : COD (She loves me) · COI (Send me an email) · après to, for, with, about, from, between, like (This is for me) · complément composé (The teacher asks Anna and me) · après let et devant un infinitif (Let me explain · They want me to stay).</p><p>Politesse : on se cite <b>en dernier</b> → Sarah and I.</p>"},
 {id:'count',lvl:2,name:'Dénombrables · a / an / some / any',ic:'',c:'#E08A00',sheet:"<p><b>Dénombrable (C)</b> : on peut compter → a chair, two books, an egg, three friends.</p><p><b>Indénombrable (U)</b> : pas de pluriel, pas de a/an → water, bread, money, rice, sugar, coffee, music, advice, information.</p><p>Test : peux-tu dire « two … » ? two apples ✓ → C · two waters ✗ → U.</p><p><b>a / an</b> → dénombrable au singulier (an devant un <b>son</b> voyelle : an orange, an hour).</p><p><b>some / any</b> → pluriel ou indénombrable. some = affirmatif et offre polie · any = négatif et question.</p><p>⚠️ Pièges pour un francophone : ❌ advices · ❌ informations · ❌ a bread → some advice, some information, some bread.</p>"}
];
SK.push({id:'house',lvl:2,name:'Vocabulaire : la maison',ic:'',c:'#7A4FB5',sheet:''});
const SKM={};SK.forEach(s=>SKM[s.id]=s);

const Q=[];
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const add=o=>{o.lvl=SKM[o.skill].lvl;o.id=o.skill+'_'+hash(o.type+(o.prompt||o.word||o.title)+(o.say||'')+(o.opts?o.opts[0]:'')+(o.acc?o.acc[0]:'')+(o.sentence||'')+(o.pairs?o.pairs[0][0]:''));Q.push(o)};
const M=(skill,prompt,opts,why,x)=>add(Object.assign({type:'mcq',skill,prompt,opts,why},x));
const G=(skill,prompt,acc,why,x)=>add(Object.assign({type:'gap',skill,prompt,acc,why},x));
const O=(skill,prompt,sentence,why,x)=>add(Object.assign({type:'ord',skill,prompt,sentence,why},x));
const D=(skill,word,why,x)=>add(Object.assign({type:'dict',skill,word,why,acc:[word]},x));
const X=(skill,title,pairs,why)=>add({type:'match',skill,title,pairs,why});
const F=(skill,prompt,re,example,why,x)=>add(Object.assign({type:'free',skill,prompt,re,acc:[example],why},x));

/* ---------- Niveau 1 ---------- */
M('num',"The number after twelve →",["thirteen","fourteen","thirty","eleven"],"13 = <b>thirteen</b> (-teen, accent à la fin). <b>thirty</b> = 30 (accent au début). Même piège : fourteen / forty, fifteen / fifty.");
G('num',"The day before Friday → ___",["thursday"],"<b>Thursday</b>. Les jours de la semaine prennent toujours une <b>majuscule</b> en anglais.");
G('num',"You use it to write. → a ___",["pen"],"<b>a pen</b> = un stylo. Un crayon = a pencil.");

/* ---------- Niveau 2 : I ou me ? ---------- */
G('ime',"___ am learning English.",["I"],"Le pronom fait l'action, il est devant le verbe : c'est le <b>sujet</b> → <b>I</b> (toujours avec une majuscule).");
G('ime',"Can you help ___ ?",["me"],"C'est moi qui <b>reçois</b> l'aide → complément → <b>me</b>.");
G('ime',"My brother and ___ live in London.",["I"],"Sujet composé. Test magique : « ___ live in London » → <b>I</b> live → My brother and <b>I</b>.");
G('ime',"This gift is for ___.",["me"],"Après une <b>préposition</b> (for) → <b>me</b>.");
G('ime',"Tom and ___ are best friends.",["I"],"Test magique : « ___ am Tom's friend » → <b>I</b>. Tom and I are best friends.");
G('ime',"Please call ___ tomorrow.",["me"],"On m'appelle : je <b>reçois</b> l'action → <b>me</b>.");
G('ime',"Come with ___!",["me"],"Après <b>with</b> (préposition) → <b>me</b>.");
G('ime',"Between you and ___, I don't like this film.",["me"],"Après <b>between</b> (préposition) → <b>me</b>. « Between you and I » est une faute très répandue, même chez les Anglais.");
G('ime',"They invited my parents and ___ to dinner.",["me"],"Test magique : « They invited ___ to dinner » → <b>me</b>. → my parents and me.");
G('ime',"The teacher is asking Anna and ___ a question.",["me"],"Complément composé. Test magique : « The teacher is asking ___ a question » → <b>me</b>.");
M('ime',"« Me and Sarah are going to the cinema. » Correcte ?",["Non → Sarah and I are going to the cinema.","Oui, elle est correcte.","Non → Sarah and me are going to the cinema."],"Le groupe fait l'action : sujet → <b>I</b>. Et par politesse, on se met <b>en dernier</b> : Sarah and I.",{wr:{"Oui, elle est correcte.":"Tu l'entendras souvent à l'oral, mais c'est fautif. Test magique : enlève Sarah → « Me am going » ✗ / « I am going » ✓.","Non → Sarah and me are going to the cinema.":"Bonne idée de changer l'ordre, mais « me » reste fautif : le groupe est <b>sujet</b> → Sarah and <b>I</b>."}});
M('ime',"« She calls Paul and I every day. » Correcte ?",["Non → She calls Paul and me every day.","Oui, elle est correcte.","Non → She calls I and Paul every day."],"Paul et moi <b>recevons</b> l'appel : complément → <b>me</b>.",{wr:{"Oui, elle est correcte.":"Piège classique : « and I » sonne plus chic, mais ici le groupe reçoit l'action. Test magique : « She calls I » ✗ → She calls <b>me</b>.","Non → She calls I and Paul every day.":"Changer l'ordre ne règle rien : le groupe reçoit l'action, donc <b>me</b>. Test magique : « She calls I » ✗."}});
M('ime',"« This is between you and I. » Correcte ?",["Non → This is between you and me.","Oui, elle est correcte."],"Après une préposition (<b>between</b>) → toujours <b>me</b>.",{wr:{"Oui, elle est correcte.":"Même des Anglais le disent, mais c'est fautif : <b>between</b> est une préposition, donc → me."}});
M('ime',"« Give it to I. » Correcte ?",["Non → Give it to me.","Oui, elle est correcte."],"Après <b>to</b> (préposition) → <b>me</b>.",{wr:{"Oui, elle est correcte.":"« to » est une préposition : derrière, on met toujours <b>me</b>. Give it to me."}});
M('ime',"« Me like chocolate. » Correcte ?",["Non → I like chocolate.","Oui, elle est correcte."],"C'est moi qui aime : je fais l'action → sujet → <b>I</b> like chocolate.",{wr:{"Oui, elle est correcte.":"En français on dit « moi, j'aime », mais en anglais le sujet est toujours <b>I</b>. « Me » ne peut jamais faire l'action."}});
M('ime',"« My mum and I are cooking dinner. » Correcte ?",["Oui, elle est correcte.","Non → My mum and me are cooking dinner.","Non → Me and my mum are cooking dinner."],"Sujet composé → <b>I</b>, et on se cite en dernier. Rien à corriger !",{wr:{"Non → My mum and me are cooking dinner.":"Test magique : enlève « my mum » → « Me am cooking » ✗. Le groupe est sujet, donc <b>I</b> : la phrase de départ était juste.","Non → Me and my mum are cooking dinner.":"« Me » ne peut pas faire l'action. La phrase de départ (My mum and I) était déjà correcte."}});
M('ime',"« They want I to come. » Correcte ?",["Non → They want me to come.","Oui, elle est correcte."],"Devant un <b>infinitif</b> (to come) → <b>me</b> : They want me to come.",{wr:{"Oui, elle est correcte.":"Ce sont eux qui veulent ; moi, je suis le complément de « want » → <b>me</b>. Pense à « Let me… », « They want me to… »."}});
M('ime',"Music relaxes ___.",["me","I"],"La musique fait l'action, moi je la reçois → <b>me</b>.");
M('ime',"Let ___ explain.",["me","I"],"Après <b>let</b> → toujours <b>me</b> : Let me explain, let me help.");
M('ime',"Do you like coffee? — Yes, ___ do.",["I","me"],"Réponse courte : c'est un sujet → <b>Yes, I do.</b>");
M('ime',"She's talking about ___.",["me","I"],"Après <b>about</b> (préposition) → <b>me</b>.");
M('ime',"Send ___ an email, please.",["me","I"],"C'est moi qui reçois l'email (COI) → <b>me</b>.");
O('ime',"Traduis : « Ma sœur et moi vivons ensemble. »","My sister and I live together.","Sujet composé → <b>I</b>, même si le français dit « moi ». On se cite en dernier.",{more:["me"]});
O('ime',"Traduis : « Le prof interroge Anna et moi. »","The teacher asks Anna and me.","Complément composé → <b>me</b>. Et asks avec -s (the teacher = he/she).",{more:["I","ask"]});
O('ime',"Traduis : « Elle m'appelle tous les jours. »","She calls me every day.","Je reçois l'action → <b>me</b>. Et n'oublie pas le -s de calls.",{more:["I","call"]});

  if(q.type==='match')return "Quelques paires ont été inversées. Relis les associations ci-dessus : ce sont elles à retenir.";
  if(q.wr){const k=Object.keys(q.wr).find(k=>norm(k)===norm(g));if(k)return q.wr[k]}
  const rights=q.type==='mcq'?[q.opts[0]]:q.type==='ord'?[q.sentence]:q.acc;
  const G=norm(g);
  for(const r of rights){
    const R=norm(r);
    if(TRAP[G+'>'+R])return TRAP[G+'>'+R];
    const gw=G.split(' '),rw=R.split(' ');
    if(gw.length===rw.length){const d=gw.map((w,i)=>w!==rw[i]?i:-1).filter(i=>i>=0);if(d.length===1&&TRAP[gw[d[0]]+'>'+rw[d[0]]])return TRAP[gw[d[0]]+'>'+rw[d[0]]]}
  }
  if(q.type==='ord'){
    const gw=words(g),rw=words(q.sentence);
    const traps=(q.more||[]).filter(w=>gw.includes(w.toLowerCase()));
    if(traps.length)return "Tu as utilisé « <b>"+esc(traps.join(' », « '))+"</b> » : c'est un mot piège qui n'a pas sa place dans cette phrase. Relis la règle pour voir pourquoi.";
    if(gw.slice().sort().join(' ')===rw.slice().sort().join(' '))return "Tous les bons mots sont là : c'est <b>l'ordre</b> qui coince. Rappel : sujet + verbe + complément. Dans une question, l'auxiliaire (do, does, have, has, can…) passe <b>devant</b> le sujet.";
    if(gw.length<rw.length)return "Il te manque des mots : la bonne phrase en compte "+rw.length+", tu en as utilisé "+gw.length+".";
  }
  if(q.type==='gap'||q.type==='dict'){
    let best=rights[0],bd=1e9;rights.forEach(r=>{const d=lev(G,norm(r));if(d<bd){bd=d;best=r}});
    const R=norm(best);
    if(R===G+'s'||R===G+'es')return "Il manque juste le <b>-s</b> final : verbe avec he / she / it (she plays) ou nom au pluriel.";
    if(G.replace(/'/g,'')===R.replace(/'/g,''))return "C'est l'<b>apostrophe</b> qui coince. Possessif : <b>'s</b> au singulier (Karl's), <b>'</b> seule après un pluriel en -s (my parents').";
    if(bd<=2&&R.length>=4)return "Presque ! Ce n'est pas une erreur de grammaire, juste d'<b>orthographe</b>. En surligné, les lettres qui manquaient ou différaient : <span class=\"dif\">"+diffHtml(g,best)+"</span>";
  }
  return '';
}

let VOICE=null;
function bestVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
    const sc=v=>{const n=v.name;let s=0;
      if(/en[-_]GB/i.test(v.lang))s+=50;

function pick(n,o){
  o=o||{};const scope=o.scope||'mix';
  let base=o.pool||Q.filter(q=>(!o.types||o.types.includes(q.type))&&(!o.skill||q.skill===o.skill)&&(!o.room||q.room===o.room));
  if(o.exclude)base=base.filter(q=>!o.exclude.has(q.id));
  if(!o.pool&&!o.skill&&isSolo()){const U=new Set(PATHALL.filter(s=>unlocked(s.id)).map(s=>s.id));base=base.filter(q=>U.has(q.skill))}
  const free=!o.pool&&!o.skill;
  if(free&&scope==='1')base=base.filter(q=>q.lvl===1);
  if(free&&scope==='2')base=base.filter(q=>q.lvl===2);
  const byLvl={1:base.filter(q=>q.lvl===1),2:base.filter(q=>q.lvl===2)};
  const out=[],used=new Set();
  while(out.length<n){
    let cand;
    if(free&&scope==='mix'){
      let lv=Math.random()<0.65?2:1;
      if(!byLvl[lv].some(q=>!used.has(q.id)))lv=3-lv;
      cand=byLvl[lv].filter(q=>!used.has(q.id));
    }else cand=base.filter(q=>!used.has(q.id));
    if(!cand.length)cand=base.filter(q=>!used.has(q.id));
    if(!cand.length)break;
    const tot=cand.reduce((s,q)=>s+weight(q),0);let r=Math.random()*tot,ch=cand[cand.length-1];
    for(const q of cand){r-=weight(q);if(r<=0){ch=q;break}}
    out.push(ch);used.add(ch.id);
  }
  return out;
}

function buildEtape(sid,k){
  const s=SKM[sid],all=Q.filter(q=>q.skill===sid),used=new Set(),out=[];
  const take=a=>a.forEach(q=>{if(!used.has(q.id)){used.add(q.id);out.push(q)}});
  const T=t=>all.filter(q=>t.includes(q.type));
  if(k==='disc'){

    const extra=TEACH[sid]?[]:pickFresh(5,T(REC));
    return cards.concat(extra.map(q=>({q})));
  }
  if(k==='train'){take(pickFresh(5,T(['mcq','match'])));take(pickFresh(8-out.length,T(['gap','free']),used));}
  if(k==='write'){take(pickFresh(8,T(['gap','ord','dict','free'])));}

function startSession(mode,o){

  else if(mode==='day'||mode==='etape'){

    if(f){const k=mode==='etape'?o.k:ETAPES[Math.min(3,etOf(f.id))].k;const e=ETAPES.find(x=>x.k===k);

function startTimer(){

  const it=P.items[P.i];P.max=it.q.type==='mcq'?30:45;P.left=P.max;

}
function autoSay(){
  const P=S.play;if(!P||P.phase!=='ask')return;const cur_=P.items[P.i];
  if(cur_.learn&&cur_.learn.en){setTimeout(()=>speak(cur_.learn.en,.8),400);return}
  if(!cur_.q)return;const q=cur_.q;
  if(q.type==='dict')setTimeout(()=>speak(q.word),350);
  else if(q.type==='mcq'&&q.say)setTimeout(()=>speak(q.say),350);
}
function ansText(q){
  if(q.type==='free')return q.acc[0];
  if(q.type==='mcq')return q.opts[0];
  if(q.type==='gap')return q.acc[0];
  if(q.type==='ord')return q.sentence;
  if(q.type==='dict')return q.word;
  return q.pairs.map(p=>p[0]+' = '+p[1]).join(' · ');
}
const promptText=q=>q.type==='dict'?'🎧 Dictée : « '+q.word+' »':q.type==='match'?q.title:q.prompt;

function submit(timeout){
  const P=S.play;if(!P||P.phase!=='ask')return;
  const it=P.items[P.i],q=it.q;let ok=false,given='';
  if(timeout){given='⏱ temps écoulé'}
  else if(q.type==='mcq'){if(it.sel==null)return;given=it.opts[it.sel].t;ok=it.opts[it.sel].ok}
  else if(q.type==='free'){given=(it.val||'').trim();if(!given){const el=$('[data-input]');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.focus()}return}ok=new RegExp(q.re,'iu').test(norm(given))}
  else if(q.type==='gap'||q.type==='dict'){given=(it.val||'').trim();if(!given){const el=$('[data-input]');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.focus()}return}ok=q.acc.map(norm).includes(norm(given))}
  else if(q.type==='ord'){if(!it.ans.length)return;given=it.ans.map(t=>t.w).join(' ');ok=norm(given)===norm(q.sentence)}
  else if(q.type==='match'){ok=it.miss<=1;given=it.miss?it.miss+' erreur'+(it.miss>1?'s':''):''}
  stopTimer();
  const pr=cur();it.res=ok?'ok':'ko';
  const r=q.teach?{box:0,seen:0,wrong:0}:(pr.q[q.id]||(pr.q[q.id]={box:0,seen:0,wrong:0}));
  r.seen++;r.last=Date.now();
  const tday=dayStr(new Date());
  if(!pr.dg||pr.dg.d!==tday)pr.dg={d:tday,n:0};pr.dg.n++;
  let gain=0;
  if(ok){if(r.d==null)r.d=r.box>=3?2:r.box>=1?1:0;if(r.ld!==tday){r.d++;r.ld=tday}
    r.box=Math.min(4,r.box+1);r.hi=Math.max(r.hi||0,r.box);P.combo++;P.maxCombo=Math.max(P.maxCombo,P.combo);gain=10+Math.min(P.combo-1,5)*2}
  else{r.box=0;r.wrong++;r.lastWrong=Date.now();P.combo=0}
  pr.xp+=gain;P.xp+=gain;
  P.answers.push({q,ok,given,gain,retry:!!it.rt});persist();
  track('ans',{k:q.skill,q:q.id,qt:q.type,ok,p:String(promptText(q)).replace(/<[^>]+>/g,'').slice(0,110)});
  beep(ok);
  if(P.fb){P.phase='fb';render()}
  else next();
}
function next(){
  const P=S.play;stopTimer();P.i++;
  if(P.i>=P.items.length&&P.fb){
    const again=P.items.filter(x=>x.q&&x.res==='ko'&&!x.redo&&(x.rt||0)<2);
    if(again.length){again.forEach(x=>{x.redo=true;const c=prep(x.q,P.easy);c.rt=(x.rt||0)+1;P.items.push(c)});toast(again.length>1?'On revoit tes '+again.length+' erreurs 💪':'On revoit ton erreur 💪')}
  }
  if(P.i>=P.items.length){finish();return}
  P.phase='ask';render();startTimer();autoSay();
}
function finish(){
  stopTimer();const P=S.play,pr=cur();
  const first=P.answers.filter(a=>!a.retry),total=Math.max(1,first.length),ok=first.filter(a=>a.ok).length,pct=ok/total;
  const bonus=20;pr.xp+=bonus;touchStreak(pr);
  const tday=dayStr(new Date());if(!pr.days.includes(tday)){pr.days.push(tday);pr.days=pr.days.slice(-60)}
  let ET=null;
  if(P.etape){const {sid,k}=P.etape,ix=ETAPES.findIndex(e=>e.k===k);pr.et=pr.et||{};const before=pr.et[sid]||0;
    if(k==='defi'){const pass=pct>=.7;if(pass)pr.et[sid]=4;ET={sid,k,pass,advanced:pass&&before<4}}
    else{if(before<=ix)pr.et[sid]=ix+1;ET={sid,k,pass:true,advanced:before<=ix}}}
  const moved=Object.keys(P.snap||{}).map(k=>{const I=skillInfo(k),b=P.snap[k];return{k,name:SKM[k].name,b:b.st,a:I.st,gain:I.c.ok-b.ok}});
  pr.stamps=pr.stamps||{};const newStamps=(ET&&ET.k==='defi'&&ET.pass&&!pr.stamps[ET.sid])?[ET.sid]:[];newStamps.forEach(k=>{pr.stamps[k]=Date.now()});
  pr.hist.unshift({t:Date.now(),label:P.label,ok,total,exam:P.mode==='exam'});pr.hist=pr.hist.slice(0,30);
  if(P.mode==='exam')pr.bestExam=Math.max(pr.bestExam||0,ok);
  if(P.mode==='last')pr.lastDone=LAST.id;
  persist();
  S.res={label:P.label,mode:P.mode,ok,total,pct,xp:P.xp+bonus,maxCombo:P.maxCombo,wrong:P.answers.filter(a=>!a.ok&&!a.retry&&!a.q.teach),unit:P.unit,room:P.room,g:P.g,step:P.step,moved,newStamps,et:ET};
  track('end',{k:P.mk,a:ok,b:total,p:String(Math.round((Date.now()-P.t0)/1000))});newStamps.forEach(k=>track('stamp',{k}));flush();
  S.play=null;S.screen='result';render();
}

/* ---------- statistiques ---------- */
function skillStat(sid){
  const qs=Q.filter(q=>q.skill===sid),p=cur().q;let s=0,seen=0;
  qs.forEach(q=>{const r=p[q.id];if(r){seen++;s+=Math.min(r.box,3)/3}});
  return{n:qs.length,seen,pct:Math.round(s/qs.length*100)};
}
function lvlPct(l){
  const qs=Q.filter(q=>q.lvl===l),p=cur().q;let s=0;
  qs.forEach(q=>{const r=p[q.id];if(r)s+=Math.min(r.box,3)/3});
  return Math.round(s/qs.length*100);
}


/* ---------- états d'apprentissage : Nouveau → En cours → Fragile → Acquis ---------- */
const REC=['mcq','match'],PROD=['gap','ord','dict'];
const DAYMS=864e5,GOAL=20;
const PATH=SK.filter(s=>s.lvl===2),L1=SK.filter(s=>s.lvl===1);
// Acquis = 3 bonnes réponses d'affilée, sur au moins 2 jours différents. Redevient fragile après 30 jours sans révision.
function qState(r){
  if(!r)return 'new';
  if(r.box>=3){if(r.d!=null&&r.d<2)return 'cur';return(Date.now()-(r.last||0)>30*DAYMS)?'frag':'ok'}
  const hadOk=(r.hi||0)>=2||(r.seen-r.wrong)>=2;
  if(r.box<2&&r.wrong>0&&hadOk)return 'frag';
  return 'cur';
}
function skillInfo(sid){
  const qs=Q.filter(q=>q.skill===sid),p=cur().q,c={ok:0,frag:0,cur:0,new:0};
  qs.forEach(q=>c[qState(p[q.id])]++);
  const n=qs.length,seen=n-c.new;let st='cur';
  if(!seen)st='new';
  else if(c.ok>=0.7*n&&c.frag<=0.1*n)st='ok';
  else if(c.frag>=Math.max(2,0.15*seen))st='frag';
  return{n,seen,c,st,pct:skillStat(sid).pct};
}
function stepPct(sid,types){
  const qs=Q.filter(q=>q.skill===sid&&types.includes(q.type)),p=cur().q;if(!qs.length)return null;
  let s=0;qs.forEach(q=>{const r=p[q.id];if(r)s+=Math.min(r.box,2)/2});return Math.round(s/qs.length*100);
}
const PATHALL=L1.concat(PATH);
const isSolo=()=>{const p=cur();return !!p&&p.mode==='solo'};
const myPath=()=>isSolo()?PATHALL:PATH;
// Parcours débutant : une leçon se débloque quand la précédente est réussie à 50 % (ou acquise).
const UNLOCK=50;
function unlocked(sid){
  if(!isSolo())return true;
  const i=PATHALL.findIndex(s=>s.id===sid);if(i<=0)return true;
  return etOf(PATHALL[i-1].id)>=4;
}
// Leçon du moment : la première pas encore réussie à 50 % ; au-delà, elle se consolide par les révisions.
function focusSkill(){return myPath().filter(s=>unlocked(s.id)).find(s=>etOf(s.id)<4)||null}
function isDue(q){const r=cur().q[q.id];if(!r)return false;const iv=[0,1,3,7,16][Math.min(r.box,4)];return Date.now()-(r.last||0)>=iv*DAYMS}
const todayN=pr=>pr.dg&&pr.dg.d===dayStr(new Date())?pr.dg.n:0;
function dayPlan(){
  const f=focusSkill(),fid=f&&f.id;
  const recent=isSolo()?[]:LAST.skills.filter(k=>k!==fid&&SKM[k]&&skillInfo(k).st!=='ok').slice(0,2);
  const due=Q.filter(q=>q.skill!==fid&&isDue(q));
  const err=errPool().filter(q=>q.skill!==fid);
  return{f,recent,due,err,nDue:Math.min(3,due.length),nErr:Math.min(2,err.length)};
}
function buildDay(){
  const P=dayPlan(),out=[],used=new Set();
  const take=a=>a.forEach(q=>{if(q&&!used.has(q.id)&&out.length<12){used.add(q.id);out.push(q)}});
  if(P.f){const rec=stepPct(P.f.id,REC);take(pick(5,{skill:P.f.id,types:(rec===null||rec>=70)?PROD:REC,exclude:used}))}
  P.recent.forEach(k=>take(pick(2,{skill:k,exclude:used})));
  take(shuffle(P.err).slice(0,2));
  const dues=shuffle(P.due).slice(0,3);take(dues);
  if(dues.length<3)take(pick(3-dues.length,{scope:'1',exclude:used}));
  if(out.length<12&&P.f)take(pick(12-out.length,{skill:P.f.id,exclude:used}));
  if(out.length<12)take(pick(12-out.length,{scope:'mix',exclude:used}));
  return shuffle(out);
}

function lineHtml(list,fid){
  const st=list.map(s=>{const lk=!unlocked(s.id);const I=lk?null:skillInfo(s.id);return{s,lk,I,now:!lk&&s.id===fid}});
  return '<div class="lmap">'+st.map((x,i)=>{
    const s=x.s,c=lineColor(s),nx=st[i+1];
    const e=x.lk?0:etOf(s.id),done=e>=4,fr=done&&x.I.st==='frag';
    const cls=x.lk?'lock':x.now?'now':done?(fr?'frag':'ok'):e>0?'cur':'new';
    const dot=x.lk?'🔒':x.now?TRAIN_IC:done?(fr?'!':'✓'):'';
    const tag=x.lk?'Se débloque après la station précédente'
      :x.now?'Tu es ici · étape '+(e+1)+'/4 : '+ETAPES[Math.min(3,e)].n
      :done?'':e>0?'Étape '+(e+1)+'/4 : '+ETAPES[e].n:'Pas encore commencée';
    const right=x.lk?'':done?(fr?'<span class="stamp f">À REVOIR</span>':'<span class="stamp">VALIDÉE</span>')
      :(!isSolo()&&LAST.skills.includes(s.id)&&x.I.st!=='ok')?'<span class="ptag">vu en classe</span>':'';
    const seg=nx?`<span class="lseg${nx.lk?' dash':''}" style="--lc:${c}"></span>`:'';
    return `<button class="stn ${cls}" style="--lc:${c}" data-act="lesson" data-id="${s.id}">${seg}<span class="dot">${dot}</span><span><span class="nm">${s.name}</span>${tag?`<span class="tg">${tag}</span>`:''}</span>${right}</button>`;
  }).join('')+'</div>';
}
function homeMsg(f){
  const pr=cur(),nm=esc(pr.name);

function fwHtml(){
  const pr=cur();if(Object.keys(pr.q).length<15)return '';
  const acc=sid=>{let n=0,w=0;Q.forEach(q=>{if(q.skill!==sid)return;const r=pr.q[q.id];if(r){n+=r.seen;w+=r.wrong}});return{n,a:n?(n-w)/n:0}};
  const inf=SK.map(s=>Object.assign({s},skillInfo(s.id),{acc:acc(s.id)})).filter(x=>x.acc.n>=5);
  const good=inf.filter(x=>x.st==='ok'||(x.acc.a>=.85&&x.acc.n>=8)).sort((a,b)=>b.acc.a-a.acc.a);
  const weak=inf.filter(x=>x.st==='frag'||x.acc.a<.6).sort((a,b)=>a.acc.a-b.acc.a);
  if(!good.length&&!weak.length)return '';
  const ls=a=>a.length?a.slice(0,2).map(x=>x.s.name).join(' · '):'<span style="color:var(--mute)">Pas encore, ça vient.</span>';
  return `<div class="fw"><div><div class="t" style="color:var(--green)">Tu maîtrises</div>${ls(good)}</div><div><div class="t" style="color:var(--amber)">À retravailler</div>${ls(weak)}</div></div>`;
}

  }
  h+=`<div class="foot"><button class="btn red full" data-act="learnNext">${P.i+1>=n?'Terminer':'Continuer'}</button></div>`;
  if(P.quit)h+=`<div class="ov"><div class="card"><b>Quitter la leçon ?</b><p class="mut">Tu pourras la reprendre depuis la station.</p><button class="btn red full" data-act="quit">Quitter</button><button class="btn ghost full" data-act="noquit">Continuer</button></div></div>`;
  return h;
}
function viewPlay(){
  const P=S.play,it=P.items[P.i];if(!it.q)return learnView(P,it);const q=it.q,n=P.items.length,fb=P.phase==='fb';
  const last=fb?P.answers[P.answers.length-1]:null;
  const dots=P.items.map((x,i)=>`<i class="${i===P.i&&!fb?'c':x.res?(P.fb?(x.res==='ko'?'ko':'d'):'d'):''}"></i>`).join('');
  let h=`<div class="ph"><button class="x" data-act="askquit" aria-label="Quitter">✕</button><div class="tube" aria-label="Question ${P.i+1} sur ${n}">${dots}</div><span class="combo">${P.combo>1?'×'+P.combo:''}</span></div>`;
  if(P.timer)h+=`<div class="tm"><i id="tmb" style="width:${P.left?P.left/P.max*100:100}%"></i></div><small id="tm">${P.left||''} s</small>`;
  h+=`<div class="tag">${it.rt?'🔁 On revoit ton erreur — ':''}${SKM[q.skill].name} — ${P.mode==='exam'?'question '+(P.i+1)+' / '+n:INSTR[q.type]}</div>`;
  if(q.ctx)h+=`<div class="ctx">${q.ctx}</div>`;
  if(q.type==='dict'){
    h+=`<div class="q">Écoute et écris le mot.</div><div class="spk"><button class="btn" data-act="say">🔊 Écouter</button><button class="btn" data-act="slow">Plus lent</button><button class="btn" data-act="hint">Indice</button></div>${it.hint?`<div class="ctx">${esc(q.hint||'Pas d\'indice pour celui-ci.')}</div>`:''}`;
  }else if(q.type==='match'){
    h+=`<div class="q">${esc(q.title)}</div>`;
  }else{
    h+=`<div class="q">${esc(q.prompt).replace(/___/g,'<span class="blank"></span>')}</div>`;
    if(q.say)h+=`<div class="spk"><button class="btn" data-act="say">🔊 Écouter</button><button class="btn" data-act="slow">Plus lent</button></div>`;
  }
  if(q.type==='mcq'){
    h+=`<div>${it.opts.map((o,i)=>{let c='opt';if(fb){if(o.ok)c+=' good';else if(it.sel===i)c+=' wrong'}else if(it.sel===i)c+=' sel';return `<button class="${c}" data-act="pick" data-i="${i}" ${fb?'disabled':''}>${esc(o.t)}</button>`}).join('')}</div>`;
  }else if(q.type==='gap'||q.type==='dict'||q.type==='free'){
    h+=`<input class="inp" data-input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ta réponse…" value="${esc(it.val||'')}" ${fb?'disabled':''}>`;
  }else if(q.type==='ord'){
    h+=`<div class="line">${it.ans.map(t=>`<button class="tile in" data-act="untile" data-k="${t.i}">${esc(t.w)}</button>`).join('')}</div>
    <div class="bank">${it.bank.filter(t=>!it.ans.some(a=>a.i===t.i)).map(t=>`<button class="tile" data-act="tile" data-k="${t.i}">${esc(t.w)}</button>`).join('')}</div>`;
  }else if(q.type==='match'){
    h+=`<div class="mcols"><div>${it.left.map(l=>`<button class="mt${it.done.includes(l.i)?' done':''}${it.sel===l.i?' sel':''}" data-act="mL" data-i="${l.i}">${esc(l.t)}</button>`).join('')}</div>
    <div>${it.right.map(r=>`<button class="mt${it.done.includes(r.i)?' done':''}${it.bad===r.i?' bad':''}" data-act="mR" data-i="${r.i}">${esc(r.t)}</button>`).join('')}</div></div>`;
  }
  if(!fb&&q.type!=='match'){
    const ready=q.type==='mcq'?it.sel!=null:true;
    h+=`<div class="foot"><button class="btn red full" data-act="check" ${ready?'':'disabled'}>${P.fb?'Vérifier':(P.i+1>=n?'Terminer':'Valider')}</button></div>`;
  }
  if(fb)h+=sheetHtml(last,P);
  if(P.quit)h+=`<div class="ov"><div class="card"><b>Quitter la partie ?</b><p class="mut">Les réponses déjà données restent comptées dans tes progrès.</p><button class="btn red full" data-act="quit">Quitter</button><button class="btn ghost full" data-act="noquit">Continuer</button></div></div>`;
  return h;
}
function sheetHtml(a,P){
  const q=a.q,end=P.i+1>=P.items.length;
  return `<div class="sheet ${a.ok?'':'bad'}" role="status"><div class="sh-in">
  <div class="sh-t">${teacher('k',a.ok?'cheer':'oops',46)}<div><h3>${a.ok?pickOne(PRAISE):pickOne(OOPS)}</h3>${a.ok?`<small>+${a.gain} XP${P.combo>2?' · '+P.combo+' bonnes réponses d\'affilée':''}</small>`:'<small>Regardons ça ensemble.</small>'}</div></div>
  ${a.ok?(q.type==='free'?`<p class="ans">Parfait : « ${esc(a.given)} » 👏</p><div class="why"><b>À retenir</b><div>${q.why}</div></div>`:`<details class="d"><summary>Pourquoi ?</summary>${q.why}</details>`):(q.type==='free'?`<p class="ans"><b>Exemple :</b> ${esc(q.acc[0])}</p><p class="mine">Ta réponse : <s>${esc(a.given)}</s></p><div class="why"><b>La règle</b><div>${q.why}</div></div>`:explainBlock(a))}
  ${q.us?`<div class="us">Aux États-Unis : ${q.us}</div>`:''}
  <button class="btn ${a.ok?'green':'red'} full" data-act="next">${end?'Terminer':'Continuer'}</button></div></div>`;
}
function weekHtml(){
  const pr=cur(),L=['D','L','M','M','J','V','S'],out=[];
  for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*DAYMS),k=dayStr(d),y=(pr.days||[]).includes(k);out.push(`<span class="${y?'y':''}${i===0?' t':''}">${y?'✓':L[d.getDay()]}</span>`)}
  return `<div class="week">${out.join('')}</div>`;
}
function confettiHtml(){const c=['#D02B27','#F2C230','#1F57B5','#2E6E4F','#8E2A44'];let h='<div class="confetti" aria-hidden="true">';for(let i=0;i<28;i++)h+=`<i style="left:${(i*37)%100}%;background:${c[i%5]};animation-delay:${.5+(i%7)*.13}s"></i>`;return h+'</div>'}
function viewResult(){
  const R=S.res,p=R.pct,pr=cur(),tn=todayN(pr);
  const msg=p>=.9?['cheer',"Brilliant!","Excellent travail."]:p>=.7?['happy',"Very good!","Quelques détails à revoir, c'est tout."]:p>=.4?['think',"Good effort.","Regardons tes erreurs ensemble."]:['oops',"Don't worry!","C'est comme ça qu'on apprend. Relis les corrections ci-dessous."];
  const pass=R.mode==='exam'?(R.ok>=17):null;
  const mv=(R.moved||[]).filter(m=>m.a!==m.b||m.gain>0);
  const ns=R.newStamps||[];
  const others=Object.keys(pr.stamps||{}).filter(k=>!ns.includes(k)&&SKM[k]).slice(-4);
  const pos=[['left:16px;top:34px','12deg'],['right:14px;top:30px','-14deg'],['left:20px;bottom:14px','-6deg'],['right:18px;bottom:16px','9deg']];
  const head=ns.length
    ?`<div class="rewhead"><span class="hand">Station acquise!</span><small>${R.mode==='day'?'Séance du jour terminée':esc(R.label)}</small></div>
      <div class="passport"><span class="pt">PASSPORT · TEA TIME UNDERGROUND</span>${others.map((k,i)=>`<span class="oldst" style="${pos[i][0]};color:${STC[i]};transform:rotate(${pos[i][1]})">${esc(short(k)).toUpperCase().slice(0,12)}</span>`).join('')}
      <div class="bigstamp"><small>TEA TIME UNDERGROUND</small><b>${esc(short(ns[0])).toUpperCase()}</b><small>${new Date().toLocaleDateString('fr-BE',{day:'numeric',month:'short',year:'numeric'}).toUpperCase()}</small></div></div>
      ${ns.length>1?`<p class="mut" style="text-align:center">+ ${ns.slice(1).map(k=>short(k)).join(', ')}</p>`:''}`
    :`<div class="rewhead"><span class="hand">${msg[1]}</span><small>${R.mode==='day'?'Séance du jour terminée':esc(R.label)} · ${msg[2]}</small></div>`;
  const E=R.et;let etHead='';
  if(E&&!ns.length){const e=etOf(E.sid);
    etHead=E.k==='defi'&&!E.pass?`<div class="rewhead"><span class="hand">Presque !</span><small>Il faut 70 % au défi pour valider « ${esc(short(E.sid))} ». Tes erreurs vont revenir : refais-le quand tu veux.</small></div>`
      :`<div class="rewhead"><span class="hand">Étape réussie !</span><small>${esc(short(E.sid))} · ${ETAPES.findIndex(x=>x.k===E.k)+1}/4 « ${ETAPES.find(x=>x.k===E.k).n} »</small></div><div class="etdots">${ETAPES.map((x,i)=>`<span class="${i<e?'y':''}"></span>`).join('')}</div>`}
  const nf=focusSkill(),nextLbl=nf?(nf.id===(E&&E.sid)?'Étape suivante : '+ETAPES[etOf(nf.id)].n:'Prochaine station : '+short(nf.id)):'';
  const party=ns.length||p>=.9||pass;
  return `${party?confettiHtml():''}${E&&!ns.length?etHead:head}
  <div class="potrow">${p>=.7||pass?teapot(110,true):teacher('k',msg[0],86)}<div><div class="hand">${R.ok}/${R.total}</div><small>${p>=.7?'Earl Grey est fier de toi !':'Miss Kokkinis t\'explique tout en dessous.'}</small></div></div>
  ${pass===null?'':`<div class="pass ${pass?'y':'n'}">${pass?'Examen réussi !':'À repasser : il faut 17/20.'}</div>`}
  <p class="mut" style="text-align:center">+${R.xp} XP${R.maxCombo>2?' · '+R.maxCombo+' bonnes réponses d\'affilée':''} · objectif du jour ${Math.min(tn,GOAL)}/${GOAL}${tn>=GOAL?' ✓':''}</p>
  ${mv.length?`<h2 class="h2">Ce qui a bougé aujourd'hui</h2><div class="card" style="padding:4px 14px">${mv.map(m=>`<div class="mv"><b>${m.name}</b><span>${m.a!==m.b?bd(m.b)+'<span class="ar">→</span>'+bd(m.a):bd(m.a)}${m.gain>0?`<small style="display:block;text-align:right">+${m.gain} question${m.gain>1?'s':''} acquise${m.gain>1?'s':''}</small>`:''}</span></div>`).join('')}</div>`:''}
  ${R.wrong.length?`<p class="mut">Les ${R.wrong.length} question${R.wrong.length>1?'s':''} ratée${R.wrong.length>1?'s':''} reviendront dans tes prochains trajets.</p>`:''}
  <h2 class="h2">Ma série</h2>${weekHtml()}
  <p class="mut" style="text-align:center">${streakNow(pr)} jour${streakNow(pr)>1?'s':''} d'affilée. Prochain train demain !</p>
  ${R.wrong.length?`<h2 class="h2">Corrections (${R.wrong.length})</h2>${R.wrong.map(a=>`<div class="card"><b>${esc(promptText(a.q))}</b>${explainBlock(a)}${a.q.us?`<div class="us">Aux États-Unis : ${a.q.us}</div>`:''}</div>`).join('')}`:(R.ok<R.total?'<p class="mut" style="text-align:center">Tes erreurs ont été revues et corrigées pendant la leçon ✓</p>':'<p class="mut" style="text-align:center">Aucune faute. Parfait !</p>')}
  ${E&&nf?`<button class="btn red full" data-act="cont">${E.k==='defi'&&!E.pass?'Refaire le défi':esc(nextLbl)} ›</button>`:''}
  <button class="btn ${E&&nf?'ghost':'red'} full" data-act="go" data-to="home">Retour à la station</button>
  ${E?'':`<button class="btn ghost full" data-act="again">${R.mode==='day'?'Encore un trajet':'Rejouer'}</button>`}
  ${R.wrong.length&&R.mode!=='errors'?`<button class="btn ghost full" data-act="play" data-m="errors">Refaire mes erreurs</button>`:''}`;
}
function render(){
  {const pr=DB.current&&DB.profiles[DB.current];if(pr&&!pr.et){pr.et={};SK.forEach(s=>{const I=skillInfo(s.id);pr.et[s.id]=I.st==='ok'?4:I.pct>=50?2:I.pct>=20?1:0});persist()}}
  if(S.screen!=='play')stopTimer();
  if(!DB.current||!DB.profiles[DB.current])S.screen='profiles';
  else if(S.screen==='profiles')S.screen='home';
  let h='';
  switch(S.screen){
    case 'profiles':h=viewProfiles();break;
    case 'home':h=SC+hdr()+viewHome()+nav('home');break;
    case 'course':h=SC+hdr()+(S.course&&SKM[S.course]?viewLesson():viewCourse())+nav('course');break;
    case 'progress':h=SC+hdr()+viewProgress()+nav('progress');break;
    case 'settings':h=SC+hdr()+viewSettings()+nav('settings');break;
    case 'play':h=viewPlay();break;
    case 'result':h=viewResult();break;
  }
  app.innerHTML=h;
  if(S.screen==='play'&&S.play.phase==='ask'){
    const q=S.play.items[S.play.i].q;if(!q){}else
    if(q&&(q.type==='gap'||q.type==='dict'||q.type==='free')){const el=$('[data-input]');if(el)setTimeout(()=>{try{el.focus()}catch(e){}},60)}
  }
}
function go(to){S.screen=to;S.course=null;S.code='';S.msg='';S.confirmDel=false;render();window.scrollTo(0,0)}

/* =====================================================================
   5. ÉVÉNEMENTS
   ===================================================================== */
const A={
  go:d=>go(d.to),
  login:d=>{DB.current=d.id;persist();S.screen='home';render();window.scrollTo(0,0)},
  newT:d=>{const el=$('#pname');if(el)S.newName=el.value;S.newT=d.t;render()},
  create:()=>{
    const el=$('#pname'),name=((el&&el.value)||'').trim();
    if(!name){toast('Écris ton prénom 🙂');if(el)el.focus();return}
    newProfile(name,S.newT,S.newMode);S.newName='';S.screen='home';render();window.scrollTo(0,0);
  },
  scope:d=>{cur().scope=d.k;persist();render()},
  play:d=>startSession(d.m),
  game:d=>startSession('game',{g:d.g}),
  unit:d=>startSession('unit',{skill:d.id,room:d.room}),
  newMode:d=>{const el=$('#pname');if(el)S.newName=el.value;S.newMode=d.m;render()},
  myMode:d=>{cur().mode=d.m;persist();render();toast(d.m==='solo'?'Parcours : depuis le niveau 1':'Parcours : cours de Miss Kokkinis')},
  learnNext:()=>{const P=S.play,it=P.items[P.i];it.res='seen';try{speechSynthesis.cancel()}catch(e){}next()},
  sayl:()=>{const it=S.play.items[S.play.i];speak(it.learn.en,.8)},
  sayls:()=>{const it=S.play.items[S.play.i];speak(it.learn.en,.55)},
  sayline:d=>{const it=S.play.items[S.play.i];speak(it.dialog[+d.i][1],.8)},
  sayall:()=>{const it=S.play.items[S.play.i];speak(it.dialog.map(l=>l[1]).join(' … '),.8)},
  etape:d=>{const i=ETAPES.findIndex(e=>e.k===d.k);if(i>etOf(d.id)){toast("Termine d'abord l'étape « "+ETAPES[etOf(d.id)].n+" »");return}startSession('etape',{skill:d.id,k:d.k})},
  cont:()=>startSession('day'),
  lesson:d=>{if(!unlocked(d.id)){const i=PATHALL.findIndex(s=>s.id===d.id);toast('Réussis d\'abord « '+PATHALL[i-1].name+' » à '+UNLOCK+' %');return}track('lesson',{k:d.id});S.screen='course';S.course=d.id;S.showSheet=false;render();window.scrollTo(0,0)},
  step:d=>{if(d.k==='read'){S.showSheet=!S.showSheet;render();return}startSession('unit',{skill:d.id,step:d.k})},
  read:d=>{const pr=cur();pr.read=pr.read||{};pr.read[d.id]=Date.now();persist();track('read',{k:d.id});S.showSheet=false;render();toast('Cours lu ✓ Passe à l\'étape suivante.')},
  again:()=>{const R=S.res;if(R.mode==='day'||R.mode==='etape'){if(R.et)startSession('etape',{skill:R.et.sid,k:R.et.k});else startSession('day');return}if(R.mode==='unit')startSession('unit',{skill:R.unit,room:R.room,step:R.step});else if(R.mode==='game')startSession('game',{g:R.g});else startSession(R.mode)},
  sheet:d=>{S.screen='course';S.course=d.id;S.showSheet=true;render();window.scrollTo(0,0)},
  back:()=>{S.course=null;S.showSheet=false;render();window.scrollTo(0,0)},
  pick:d=>{const P=S.play;if(P.phase!=='ask')return;P.items[P.i].sel=+d.i;render()},
  check:()=>submit(false),
  next:()=>next(),
  say:()=>{const q=S.play.items[S.play.i].q;speak(q.say||q.word)},
  slow:()=>{const q=S.play.items[S.play.i].q;speak(q.say||q.word,.6)},
  hint:()=>{const it=S.play.items[S.play.i];it.hint=true;render()},
  tile:d=>{const P=S.play,it=P.items[P.i];if(P.phase!=='ask')return;const t=it.bank.find(x=>x.i===+d.k);if(t&&!it.ans.some(a=>a.i===t.i)){it.ans.push(t);render()}},
  untile:d=>{const P=S.play,it=P.items[P.i];if(P.phase!=='ask')return;it.ans=it.ans.filter(a=>a.i!==+d.k);render()},
  mL:d=>{const it=S.play.items[S.play.i];if(it.done.includes(+d.i))return;it.sel=+d.i;render()},
  mR:d=>{
    const P=S.play,it=P.items[P.i];if(it.sel==null||it.done.includes(+d.i))return;
    if(+d.i===it.sel){it.done.push(it.sel);it.sel=null;render();if(it.done.length===it.q.pairs.length)setTimeout(()=>{if(S.play===P&&P.items[P.i]===it)submit(false)},500)}
    else{it.miss++;it.bad=+d.i;it.sel=null;render();setTimeout(()=>{if(S.play===P){it.bad=null;render()}},450)}
  },
  askquit:()=>{S.play.quit=true;stopTimer();render()},
  noquit:()=>{S.play.quit=false;render();startTimer()},
  quit:()=>{stopTimer();if(S.play)track('quit',{k:S.play.mk,a:S.play.i});flush();S.play=null;go('home')},
  myT:d=>{cur().teacher=d.t;persist();render()},
  stats:()=>{DB.noStats=!DB.noStats;if(DB.noStats){SQ=[];saveQ()}persist();render()},
  snd:()=>{const pr=cur();pr.sound=!pr.sound;persist();render()},
  export:()=>{
    try{S.code=btoa(unescape(encodeURIComponent(JSON.stringify(cur()))))}catch(e){S.code='';S.msg="Impossible de générer le code."}
    render();
  },
  import:()=>{
    const el=$('#imp'),v=((el&&el.value)||'').trim();
    try{
      const p=JSON.parse(decodeURIComponent(escape(atob(v))));
      if(!p||typeof p.name!=='string'||typeof p.q!=='object')throw 0;
      const id='p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
      p.id=id;p.created=Date.now();DB.profiles[id]=p;DB.current=id;persist();S.msg='';S.screen='home';render();toast('Profil importé ✔');
    }catch(e){S.msg="Ce code n'est pas valide. Vérifie que tu l'as copié en entier.";render()}
  },
  switch:()=>{DB.current=null;persist();S.screen='profiles';render()},
  askdel:()=>{S.confirmDel=true;render()},
  nodel:()=>{S.confirmDel=false;render()},
  del:()=>{delete DB.profiles[DB.current];DB.current=null;persist();S.confirmDel=false;S.screen='profiles';render()}
};
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='TEXTAREA')return;
  const f=A[el.dataset.act];if(f)f(el.dataset,e);
});
app.addEventListener('input',e=>{
  if(e.target.matches('[data-input]')&&S.play){S.play.items[S.play.i].val=e.target.value}
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-input]')){e.preventDefault();submit(false)}
  if(e.key==='Enter'&&e.target.id==='pname'){e.preventDefault();A.create()}
});
app.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('[data-sel]'))e.target.select()});

if(DB.current&&DB.profiles[DB.current]){S.screen='home'}else{S.screen='profiles'}
track('open');setTimeout(flush,4000);
render();
window.__app={TEACH,S,Q,SK,DB:()=>DB,A,startSession,submit,norm,skillInfo,qState,buildDay,dayPlan,bestVoice,unlocked,focusSkill,SQ:()=>SQ,flush}; // utile pour les tests
})();
